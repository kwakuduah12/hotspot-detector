version: 1
service_area: demo-platform
global_filters:
  exclude_paths:
    - "docs/**"
    - "**/*.md"
    - "tests/**"
hotspots:
  - id: ingest-path
    paths:
      - "demo_service/app/ingest.py"
      - "demo_service/app/index.py"
    workloads:
      - ingest_bulk
    notes: "CPU-heavy serialize + in-memory index; see docs/methodology.md"
  - id: query-path
    paths:
      - "demo_service/app/query.py"
    workloads:
      - query_filter
    notes: "Allocation-heavy scan/filter; see docs/methodology.md"
  - id: export-path
    paths:
      - "demo_service/app/export.py"
    workloads:
      - export_jsonl
    notes: "Allocation-heavy JSONL materialize; see docs/methodology.md"
  - id: store-path
    paths:
      - "demo_service/app/store.py"
    workloads:
      - ingest_bulk
    notes: "Shared in-memory store on the ingest path; see docs/methodology.md"
workloads:
  ingest_bulk:
    description: Bulk ingest of N records through serialize then index
    command:
      - python
      - -m
      - demo_service.workloads.ingest_bulk
    repeats: 5
    operations:
      - name: serialize
        baseline_ms: 255.6
        threshold_pct: 30
        threshold_ms: 80
      - name: index
        baseline_ms: 56.2
        threshold_pct: 30
        threshold_ms: 40
  query_filter:
    description: Seeded scan/filter for a single tag
    command:
      - python
      - -m
      - demo_service.workloads.query_filter
    repeats: 5
    operations:
      - name: scan
        baseline_ms: 70.4
        threshold_pct: 30
        threshold_ms: 40
  export_jsonl:
    description: Seeded JSONL export of the full store
    command:
      - python
      - -m
      - demo_service.workloads.export_jsonl
    repeats: 5
    operations:
      - name: materialize
        baseline_ms: 129.0
        threshold_pct: 30
        threshold_ms: 40
