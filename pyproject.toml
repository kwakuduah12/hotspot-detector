[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hotspot-detector"
version = "0.1.0"
description = "PR-triggered performance regression detection via hotspot manifests"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
]

[project.scripts]
hotspot-detector = "hotspot_detector.cli:app"

[tool.setuptools]
packages = [
    "hotspot_detector",
    "demo_service",
    "demo_service.app",
    "demo_service.workloads",
]

[tool.setuptools.package-dir]
hotspot_detector = "src/hotspot_detector"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--cov=hotspot_detector",
    "--cov=demo_service",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
timeout = 60
xfail_strict = true
filterwarnings = [
    "error",
]
markers = [
    "integration: starts a local HTTP server",
]

[tool.coverage.run]
branch = true
source = ["hotspot_detector", "demo_service"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
