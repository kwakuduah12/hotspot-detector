name: nightly

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  remeasure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run all workloads vs golden snapshot
        run: |
          mkdir -p results
          hotspot-detector run \
            --manifest demo_service/hotspot-manifest.yaml \
            --all \
            --output results/nightly-run.json
          hotspot-detector compare \
            --run results/nightly-run.json \
            --manifest demo_service/hotspot-manifest.yaml \
            --baselines demo_service/baselines.yaml \
            --output results/nightly-compare.json
          hotspot-detector report \
            --run results/nightly-run.json \
            --compare results/nightly-compare.json \
            --manifest demo_service/hotspot-manifest.yaml \
            --output results/nightly-report.md
      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nightly-baselines
          path: results/
